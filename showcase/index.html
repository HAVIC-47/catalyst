<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Catalyst — Showcase</title>
<style>
  :root { --paper:#111; --ink:#F5F0E6; --accent:#E28670; --line:rgba(255,255,255,.12); --card:#161513; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#0b0a09; color:var(--ink);
    font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; line-height:1.5;
    background-image: radial-gradient(60% 45% at 12% -4%, rgba(226,134,112,.12), transparent 60%),
                      radial-gradient(50% 45% at 105% 105%, rgba(77,119,173,.10), transparent 60%); }
  .wrap { max-width:1180px; margin:0 auto; padding:64px 24px 96px; }
  header { text-align:center; margin-bottom:56px; }
  .kicker { font-family: ui-monospace, monospace; font-size:12px; letter-spacing:.28em;
    text-transform:uppercase; color:var(--accent); margin-bottom:14px; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-size:clamp(40px,7vw,76px);
    font-weight:600; letter-spacing:-.02em; }
  h1 em { color:var(--accent); }
  .sub { margin:16px auto 0; max-width:620px; color:rgba(245,240,230,.6); font-size:17px; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:26px; }
  @media (max-width:780px){ .grid{ grid-template-columns:1fr; } }
  figure { background:var(--card); border:1px solid var(--line); border-radius:16px;
    overflow:hidden; box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 18px 44px -26px #000; }
  figure.tall { grid-row: span 1; }
  .mobile { grid-column: auto; }
  figure img { display:block; width:100%; height:auto; border-bottom:1px solid var(--line); }
  figcaption { padding:14px 18px; display:flex; align-items:baseline; gap:10px; }
  figcaption .n { font-family: ui-monospace, monospace; font-size:12px; color:var(--accent); }
  figcaption .t { font-size:14px; color:rgba(245,240,230,.82); }
  .mobrow { display:grid; grid-template-columns:1fr 1fr; gap:26px; }
  @media (max-width:780px){ .mobrow{ grid-template-columns:1fr; } }
  .mobrow img { max-height:640px; width:auto; margin:0 auto; }
  footer { text-align:center; margin-top:56px; color:rgba(245,240,230,.4);
    font-family: ui-monospace, monospace; font-size:12px; letter-spacing:.1em; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">Mood × Money · ৳ BD</div>
    <h1>Catalyst <em>showcase.</em></h1>
    <p class="sub">An honest ledger that maps every taka against how the day actually felt.
      Next.js · Supabase · editorial "Almanac" design, dark + light.</p>
  </header>

  <div class="grid">
    <figure><img src="01-landing-hero-dark.png" alt="Landing hero"><figcaption><span class="n">01</span><span class="t">Landing — GSAP hero (dark)</span></figcaption></figure>
    <figure><img src="04-landing-hero-light.png" alt="Landing hero light"><figcaption><span class="n">02</span><span class="t">Landing hero — light theme</span></figcaption></figure>
    <figure><img src="02-landing-features-dark.png" alt="Features"><figcaption><span class="n">03</span><span class="t">Feature grid</span></figcaption></figure>
    <figure><img src="03-landing-cta-dark.png" alt="Why + CTA"><figcaption><span class="n">04</span><span class="t">Why Catalyst + call to action</span></figcaption></figure>
    <figure><img src="05-signup-dark.png" alt="Sign up"><figcaption><span class="n">05</span><span class="t">Email sign-up (gated auth)</span></figcaption></figure>
    <figure><img src="06-calendar-dark.png" alt="Calendar"><figcaption><span class="n">06</span><span class="t">Calendar — days tinted by mood × spend</span></figcaption></figure>
    <figure><img src="07-dashboard-top-dark.png" alt="Dashboard KPIs + trend"><figcaption><span class="n">07</span><span class="t">Dashboard — KPIs + Mood×money trend</span></figcaption></figure>
    <figure><img src="08-dashboard-donuts-dark.png" alt="Dashboard donuts"><figcaption><span class="n">08</span><span class="t">Spent / Earned / Mood / Savings donuts</span></figcaption></figure>
    <figure><img src="09-dashboard-bars-dark.png" alt="Dashboard bars"><figcaption><span class="n">09</span><span class="t">Mood-tag + category frequency bars</span></figcaption></figure>
    <figure><img src="10-transactions-dark.png" alt="Transactions"><figcaption><span class="n">10</span><span class="t">Transactions — per-day In / Out / Net</span></figcaption></figure>
    <figure><img src="11-entry-money-dark.png" alt="Entry money"><figcaption><span class="n">11</span><span class="t">Entry — Money (expense ⇄ income)</span></figcaption></figure>
    <figure><img src="12-entry-mood-dark.png" alt="Entry mood"><figcaption><span class="n">12</span><span class="t">Entry — Mood + context tags</span></figcaption></figure>
    <figure><img src="13-dashboard-light.png" alt="Dashboard light"><figcaption><span class="n">13</span><span class="t">Dashboard — light theme</span></figcaption></figure>
  </div>

  <div class="mobrow" style="margin-top:26px">
    <figure class="mobile"><img src="14-mobile-calendar-dark.png" alt="Mobile calendar"><figcaption><span class="n">14</span><span class="t">Mobile — calendar + bottom bar</span></figcaption></figure>
    <figure class="mobile"><img src="15-mobile-more-sheet-dark.png" alt="Mobile more sheet"><figcaption><span class="n">15</span><span class="t">Mobile — "More" sheet</span></figcaption></figure>
  </div>

  <footer>CATALYST · github.com/HAVIC-47/catalyst</footer>
</div>
</body>
</html>
