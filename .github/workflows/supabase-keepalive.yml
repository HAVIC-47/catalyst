# Supabase free-tier projects pause after ~7 days with no activity. This calls
# keepalive_ping() once an hour, which writes a timestamp to the single-row
# public.keepalive table — unambiguous database activity, unlike a plain read.
# See db/keepalive.sql for the table and the function.
name: Supabase keepalive

on:
  schedule:
    # Not on the hour: GitHub's :00 slot is congested and runs get delayed or dropped.
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bump keepalive row
        run: |
          resp=$(curl -sS --max-time 30 -w '\n%{http_code}' \
            -X POST \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/keepalive_ping")
          code=$(printf '%s' "$resp" | tail -n1)
          body=$(printf '%s' "$resp" | sed '$d')
          echo "HTTP $code — $body"
          [ "$code" = "200" ] || exit 1
          # The function returns the timestamp it just wrote. Today's date being in
          # there is the proof the write landed, rather than trusting the 200.
          printf '%s' "$body" | grep -q "$(date -u +%Y-%m-%d)" || { echo "no write landed"; exit 1; }
